# Builds every course folder a change touches, each on its own, the way a deploy button copies it.
# Admins can merge their own PRs in this org, so this is the check that stands in for a second reviewer.
name: Build changed folders

on:
  pull_request:
  push:
    branches: [main]
  # The weekly bump dispatches this on its branch, because PRs a workflow opens don't trigger pull_request runs.
  workflow_dispatch:
    inputs:
      base:
        description: Commit to compare against (blank builds every folder)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base || github.event.before }}
        run: |
          # An app is the nearest package.json in a course folder: <course>/<folder>/package.json, or one level
          # down when the folder holds more than one service (python-on-vercel/starter/frontend).
          apps=$(find . -mindepth 3 -maxdepth 4 -name package.json -not -path '*/node_modules/*' | sed 's|^\./||; s|/package.json$||' | sort \
            | awk '{ split($0, p, "/"); top = p[1] "/" p[2]; if (!(top in seen) || length($0) < length(seen[top])) seen[top] = $0 } END { for (t in seen) print seen[t] }' | sort)
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE" HEAD)
            dirs=$(for app in $apps; do top=$(echo "$app" | cut -d/ -f1-2); if echo "$changed" | grep -q "^$top/"; then echo "$app"; fi; done)
          else
            dirs="$apps"   # first push: build everything
          fi
          echo "dirs=$(echo "$dirs" | jq -R . | jq -sc 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "Folders to build:"; echo "$dirs"

  build:
    needs: find
    if: needs.find.outputs.dirs != '[]'
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.find.outputs.dirs) }}
    name: ${{ matrix.dir }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install
          fi
      - name: Build
        run: |
          # Give every key in .env.example a placeholder, like a deploy with its env vars set.
          # Builds that only construct clients (new Resend(...)) pass; anything that calls a real API still fails.
          if [ -f .env.example ]; then
            while IFS='=' read -r key value; do
              case "$key" in ''|\#*) continue ;; esac
              key=$(echo "$key" | xargs)
              [ -n "$value" ] || value="ci-placeholder"
              echo "$key=$value" >> "$GITHUB_ENV"
              export "$key=$value"
            done < .env.example
          fi
          # A folder whose build needs a live service (a database read at build time, Vercel OIDC) can't build here.
          # It opts out with a .ci-typecheck-only file that says why, and CI type-checks it instead of skipping it.
          if [ -f .ci-typecheck-only ]; then
            echo "::notice::Type-checking only: $(cat .ci-typecheck-only)"
            if [ -f pnpm-lock.yaml ]; then pnpm exec tsc --noEmit; else npx tsc --noEmit; fi
          elif [ -f pnpm-lock.yaml ]; then pnpm run --if-present build; else npm run build --if-present; fi

  # One fixed name to require in the repo's rules, since the build jobs are named per folder.
  builds-pass:
    needs: [find, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.find.result }}" != success ] || [[ "${{ needs.build.result }}" != success && "${{ needs.build.result }}" != skipped ]]; then
            echo "A folder failed to build."; exit 1
          fi
